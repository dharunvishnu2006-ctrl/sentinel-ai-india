[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai-india"
version = "1.1.0"
description = "Multi-agent command centre for CloudShield X and AutoPilot ML X"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "streamlit",
    "flask",
    "requests",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["src*"]